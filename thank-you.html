<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>भुगतान सफल | दिव्य ज्योतिष एवं हस्तरेखा केंद्र</title>
  
  <!-- Google Fonts: Noto Sans Devanagari + Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ================= META PIXEL CODE (PURCHASE EVENT) ================= -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    // 1. Initialize Pixel
    fbq('init', '2242280556724298');
    fbq('track', 'PageView');

    // Extract transaction params
    const urlParams = new URLSearchParams(window.location.search);
    const storedLead = JSON.parse(localStorage.getItem('astro_lead') || '{}');
    const paymentId = urlParams.get('razorpay_payment_id') || ('PAY_' + Date.now());
    const clientPhone = urlParams.get('phone') || storedLead.phone || '';
    const clientName = urlParams.get('name') || storedLead.name || '';

    // 2. Browser-side Purchase Event (Deduplicated via eventID)
    fbq('track', 'Purchase', {
      value: 1.00,
      currency: 'INR',
      content_name: '₹1 Palmistry & Kundali Consultation',
      content_type: 'product'
    }, { eventID: paymentId });
    console.log("✅ [Meta Pixel] Purchase Event Fired (Browser)");

    // 3. Server-side CAPI Call
    try {
      fetch('/api/track-purchase', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: clientPhone,
          name: clientName,
          payment_id: paymentId
        })
      }).then(r => r.json()).then(res => {
        console.log("✅ [Meta Conversions API] Server-side Purchase Tracked:", res);
      }).catch(err => console.warn("CAPI call error:", err));
    } catch(e) {}
  </script>
  <noscript>
    <img height="1" width="1" style="display:none" 
      src="https://www.facebook.com/tr?id=2242280556724298&ev=Purchase&cd[value]=1.00&cd[currency]=INR&noscript=1"
    />
  </noscript>
  <!-- ================= END META PIXEL CODE ================= -->

  <style>
    body {
      font-family: 'Noto Sans Devanagari', sans-serif;
    }
  </style>
</head>

<body class="bg-[#080511] text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-gradient-to-b from-[#180f2d] to-[#100720] border-2 border-amber-500/50 rounded-2xl p-6 sm:p-8 text-center shadow-[0_0_50px_rgba(245,158,11,0.35)] relative">
    
    <!-- Green Animated Check Icon -->
    <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-4xl mx-auto mb-5 border-2 border-emerald-500/50 shadow-[0_0_25px_rgba(16,185,129,0.5)] animate-bounce">
      <i class="fa-solid fa-check"></i>
    </div>

    <!-- Success Message -->
    <h1 class="text-2xl font-extrabold text-white mb-2">
      भुगतान सफल रहा! 🎉
    </h1>
    <p class="text-xs sm:text-sm text-amber-300 font-medium mb-6">
      आपका ₹1 का ट्रायल परामर्श सफलतापूर्वक बुक हो चुका है।
    </p>

    <!-- Details Box -->
    <div class="bg-black/40 border border-amber-500/30 rounded-xl p-4 text-left text-xs space-y-2.5 mb-6">
      <div class="flex justify-between">
        <span class="text-slate-400">ट्रायल टोकन शुल्क:</span>
        <span class="text-emerald-400 font-bold">₹1.00 (सफल)</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-400">रिपोर्ट डिलीवरी:</span>
        <span class="text-amber-300 font-semibold">24 से 48 घंटे में (WhatsApp पर)</span>
      </div>
      <div class="flex justify-between border-t border-amber-500/15 pt-2">
        <span class="text-slate-400">अगला चरण:</span>
        <span class="text-white font-medium">WhatsApp पर हथेली की फोटो भेजें</span>
      </div>
    </div>

    <!-- Redirection Notice -->
    <div class="p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-200 mb-6 flex items-center justify-center gap-2">
      <i class="fa-solid fa-spinner fa-spin text-amber-400"></i>
      <span>आप <strong id="timer" class="text-white font-bold">2</strong> सेकंड में WhatsApp पर रीडायरेक्ट हो रहे हैं...</span>
    </div>

    <!-- Big Green WhatsApp Button -->
    <a id="whatsappBtn" href="#" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-6 rounded-xl text-sm flex items-center justify-center gap-2 shadow-[0_0_25px_rgba(16,185,129,0.4)] transition">
      <i class="fa-brands fa-whatsapp text-xl"></i>
      <span>व्हाट्सएप पर तुरंत चैट खोलें</span>
    </a>

  </div>

  <!-- Auto-Redirect Script -->
  <script>
    const nameStr = clientName ? `• नाम: ${clientName}\n` : '';
    const phoneStr = clientPhone ? `• फ़ोन: ${clientPhone}\n` : '';
    const payStr = paymentId ? `• पेमेंट ID: ${paymentId}\n` : '';
    const textMsg = `जय श्री राम, मैंने ₹1 ट्रायल ले लिया है।\n\n📌 *विवरण:*\n${nameStr}${phoneStr}${payStr}\nयह मेरी दोनों हथेलियों की साफ फोटो है:`;
    const whatsappUrl = `https://wa.me/919116497140?text=${encodeURIComponent(textMsg)}`;

    const btn = document.getElementById('whatsappBtn');
    if (btn) btn.href = whatsappUrl;

    let countdown = 2;
    const timerElem = document.getElementById('timer');

    const interval = setInterval(() => {
      countdown--;
      if (timerElem) timerElem.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(interval);
        window.location.href = whatsappUrl;
      }
    }, 1000);
  </script>

</body>
</html>
